[project]
name = "grok-gadgets-linux-sdk"
version = "0.1.0a3"
description = "Capability SDK and loopback agent for Grok Gadgets"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "adidshaft" }]
keywords = ["mcp", "grok", "gadgets", "iot", "raspberry-pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
# `grok-linux-agent dev` runs the gateway in-process. The gateway never depends on this SDK.
gateway = ["grok-gadgets-gateway==0.1.0a3"]

[project.urls]
Homepage = "https://grok-gadgets.pages.dev/"
Source = "https://github.com/adidshaft/grok-gadgets-linux-sdk"
Issues = "https://github.com/adidshaft/grok-gadgets-linux-sdk/issues"
Changelog = "https://github.com/adidshaft/grok-gadgets-linux-sdk/blob/main/CHANGELOG.md"

[project.scripts]
grok-linux-agent = "grok_gadgets_linux.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_gadgets_linux"]

[dependency-groups]
dev = ["ruff==0.15.7"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
# Until the gateway is on PyPI, the extra comes from its public repository.
grok-gadgets-gateway = { git = "https://github.com/adidshaft/grok-gadgets-gateway", tag = "v0.1.0-alpha.3" }
