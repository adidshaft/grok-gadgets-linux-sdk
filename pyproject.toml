[project]
name = "grok-gadgets-linux-sdk"
version = "0.1.0a1"
description = "Capability SDK and loopback agent for Grok Gadgets"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
grok-linux-agent = "grok_gadgets_linux.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_gadgets_linux"]

[dependency-groups]
dev = ["ruff==0.15.7"]

[tool.ruff]
line-length = 100
