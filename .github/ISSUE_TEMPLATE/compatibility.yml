name: Compatibility report
description: Report a reproducible SDK compatibility issue without private home data
title: "[compatibility] "
labels: [bug, linux]
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and evidence level
      description: SDK/gateway versions, OS/kernel, transport, simulation or real peripheral; omit tokens and household names.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
