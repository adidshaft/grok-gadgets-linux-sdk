name: Compatibility report
description: Report a reproducible MCP compatibility issue without private home data
title: "[compatibility] "
labels: [bug, home-assistant]
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and evidence level
      description: HA/client versions, transport, fixture or real installation; omit tokens and household names.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
    validations:
      required: true
