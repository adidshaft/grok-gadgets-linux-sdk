name: Checks
on:
  push:
  pull_request:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-sdk-checks-matrix:
    name: linux-sdk-checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: grok-gadgets-linux-sdk
    env:
      # The seven gateway integration tests run against gateway main, never skip.
      GROK_GATEWAY_SOURCE: ${{ github.workspace }}/grok-gadgets-gateway/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok-gadgets-linux-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: main
          path: grok-gadgets-gateway
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - run: uv sync --frozen --extra gateway --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Unit and gateway-main integration tests
        run: |
          git -C ../grok-gadgets-gateway log -1 --format='Gateway main %H'
          uv run python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -q "skipped 'Set GROK_GATEWAY_SOURCE\|skipped 'Install the \[gateway\]" "$RUNNER_TEMP/tests.log"; then
            echo "Gateway integration tests skipped" >&2; exit 1
          fi
        timeout-minutes: 5
      - run: uv build
      - name: Package metadata renders on PyPI (nothing is uploaded)
        run: uvx --from 'twine==6.2.0' twine check --strict dist/*
  readme-quickstart:
    # The README quick start in a fresh clone (install, my_gadget.py, dev), then a real MCP call.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - run: python3 scripts/check_readme_quickstart.py
  linux-sdk-checks:
    name: linux-sdk-checks
    if: always()
    needs: [linux-sdk-checks-matrix, readme-quickstart]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python version and the README quick start
        env:
          MATRIX_RESULT: ${{ needs.linux-sdk-checks-matrix.result }}
          QUICKSTART_RESULT: ${{ needs.readme-quickstart.result }}
        run: test "$MATRIX_RESULT" = success && test "$QUICKSTART_RESULT" = success
